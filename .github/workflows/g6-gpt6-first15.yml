name: G6 GPT-6 first15 candidate structural checks
on:
  pull_request:
    paths:
      - 'Co_Kaggle/g6/tests_on_tasks/diagnostics/gpt6_first15/**'
      - '.github/workflows/g6-gpt6-first15.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  structural:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check source patches apply against pinned public commits
        run: python Co_Kaggle/g6/tests_on_tasks/diagnostics/gpt6_first15/verify_patch_structure.py
