name: G6 GPT-6 first15 candidate validation
on:
  pull_request:
    paths:
      - 'Co_Kaggle/g6/tests_on_tasks/diagnostics/gpt6_first15/**'
      - '.github/workflows/g6-gpt6-first15.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  structural:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check source patches apply against pinned public commits
        run: python Co_Kaggle/g6/tests_on_tasks/diagnostics/gpt6_first15/verify_patch_structure.py
  public-requests-focus:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install public Requests test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'pytest>=7' 'pytest-httpbin==2.1.0' 'httpbin~=0.10.0' 'pytest-cov' 'pytest-mock' 'trustme' 'PySocks>=1.5.6' 'charset_normalizer>=2,<4' 'idna>=2.5,<4' 'urllib3>=1.26,<3' 'certifi>=2023.5.7'
      - name: Compare baseline and patched focused public tests (not official grader)
        run: python Co_Kaggle/g6/tests_on_tasks/diagnostics/gpt6_first15/verify_public_focus.py
        env:
          G6_RESULTS_DIR: ${{ runner.temp }}/g6-first15-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g6-first15-public-focus-results
          path: ${{ runner.temp }}/g6-first15-results/public_focus_results.json
