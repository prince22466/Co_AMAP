name: v20_1 forecast event tests

on:
  pull_request:
    paths:
      - "Co_Kaggle/g5/local_arena/static_reply/v20_1.py"
      - "Co_Kaggle/g5/local_arena/static_reply/forecast_tests/**"
      - "Co_Kaggle/g5/game_history/v20/111548564.json"
      - ".github/workflows/v20-1-forecast-events.yml"
  push:
    branches:
      - main
    paths:
      - "Co_Kaggle/g5/local_arena/static_reply/v20_1.py"
      - "Co_Kaggle/g5/local_arena/static_reply/forecast_tests/**"
      - "Co_Kaggle/g5/game_history/v20/111548564.json"
      - ".github/workflows/v20-1-forecast-events.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forecast-events:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            Co_Kaggle/g5/local_arena/static_reply/v20_1.py
            Co_Kaggle/g5/local_arena/static_reply/forecast_tests
            Co_Kaggle/g5/game_history/v20/111548564.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run one-history forecast event suite
        working-directory: Co_Kaggle/g5
        run: python local_arena/static_reply/forecast_tests/test_v20_1_history_events.py -v
