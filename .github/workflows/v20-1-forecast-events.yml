name: v20_1 forecast event tests

on:
  push:
    branches:
      - test/v20-1-forecast-events
  workflow_dispatch:

jobs:
  forecast-events:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run one-history forecast event suite
        working-directory: Co_Kaggle/g5
        run: python local_arena/static_reply/forecast_tests/test_v20_1_history_events.py -v
