name: Smart Buildings V27 Smith-predictor tests

on:
  pull_request:
    paths:
      - 'Co_Kaggle/g8/submissions/submission-nb - Version 27.ipynb'
      - 'Co_Kaggle/g8/submissions/test_version27.py'
      - '.github/workflows/smart-buildings-v27.yml'
  workflow_dispatch:

jobs:
  validate-v27:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install 'numpy>=1.24,<3'
      - name: Execute exact submitted policy and gateway with synthetic observations
        run: python Co_Kaggle/g8/submissions/test_version27.py
