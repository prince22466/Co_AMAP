name: g8 Version 25 CBF-QP notebook checks

on:
  pull_request:
    paths:
      - 'Co_Kaggle/g8/submissions/submission-nb - Version 25.ipynb'
      - 'Co_Kaggle/g8/submissions/test_version25.py'
      - '.github/workflows/g8-version25-cbf-qp.yml'
  push:
    paths:
      - 'Co_Kaggle/g8/submissions/submission-nb - Version 25.ipynb'
      - 'Co_Kaggle/g8/submissions/test_version25.py'
      - '.github/workflows/g8-version25-cbf-qp.yml'

jobs:
  notebook-smoke-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline test dependency
        run: python -m pip install numpy
      - name: Check submission contract and CBF-QP regressions
        run: python Co_Kaggle/g8/submissions/test_version25.py
