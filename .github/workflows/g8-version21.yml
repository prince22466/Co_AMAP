name: g8 Version 21 checks

on:
  pull_request:
    paths:
      - "Co_Kaggle/g8/submissions/submission-nb - Version 21.ipynb"
      - "Co_Kaggle/g8/submissions/test_version21.py"
      - ".github/workflows/g8-version21.yml"
  push:
    paths:
      - "Co_Kaggle/g8/submissions/submission-nb - Version 21.ipynb"
      - "Co_Kaggle/g8/submissions/test_version21.py"
      - ".github/workflows/g8-version21.yml"
  workflow_dispatch:

jobs:
  contract-and-controller-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight test dependency
        run: python -m pip install "numpy>=1.24,<3"
      - name: Test Kaggle output contract and sliding feedback
        run: python "Co_Kaggle/g8/submissions/test_version21.py"
