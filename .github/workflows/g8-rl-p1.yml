name: g8 RL P1 checks
on:
  pull_request:
    paths:
      - "Co_Kaggle/g8/rl/**"
      - "Co_Kaggle/g8/submissions/submission-nb - Version 23.ipynb"
      - ".github/workflows/g8-rl-p1.yml"
  push:
    paths:
      - "Co_Kaggle/g8/rl/p1/**"
      - ".github/workflows/g8-rl-p1.yml"
jobs:
  p1-unit-and-physics:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned simulator dependencies
        run: python -m pip install -r Co_Kaggle/g8/rl/p0/requirements-simulator.txt
      - name: Install CPU PyTorch
        run: python -m pip install "torch>=2.5,<3" --index-url https://download.pytorch.org/whl/cpu
      - name: P1 unit tests
        run: python -m unittest Co_Kaggle.g8.rl.p1.test_p1 -v
      - name: P1 official simulator and PPO integration
        run: python -m Co_Kaggle.g8.rl.p1.physics_smoke
