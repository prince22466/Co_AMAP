name: S21 archived evaluation evidence review
on:
  push:
    branches: [g6/s21-validation-rootcause-review]
    paths:
      - 'Co_Kaggle/g6/tests_on_tasks/tools/inspect_submission21_archive.py'
      - 'Co_Kaggle/g6/tests_on_tasks/diagnostics/submission-21-zip_First15Tasks.zip'
      - 'Co_Kaggle/g6/tests_on_tasks/diagnostics/submission_21_validation_rootcause_review.md'
      - '.github/workflows/g6-submission21-diagnostics-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            Co_Kaggle/g6/tests_on_tasks/tools/inspect_submission21_archive.py
            Co_Kaggle/g6/tests_on_tasks/diagnostics/submission-21-zip_First15Tasks.zip
            Co_Kaggle/g6/tests_on_tasks/diagnostics/submission-19-zip_First15Tasks.zip
            Co_Kaggle/g6/tests_on_tasks/diagnostics/submission-20-zip_First15Tasks.zip
            Co_Kaggle/g6/tests_on_tasks/diagnostics/submission_21_validation_rootcause_review.md
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract S21 per-task verification and S19 comparison (no inference)
        run: |
          python Co_Kaggle/g6/tests_on_tasks/tools/inspect_submission21_archive.py \
            Co_Kaggle/g6/tests_on_tasks/diagnostics/submission-21-zip_First15Tasks.zip \
            --task-evidence \
            --compare Co_Kaggle/g6/tests_on_tasks/diagnostics/submission-19-zip_First15Tasks.zip \
            --control Co_Kaggle/g6/tests_on_tasks/diagnostics/submission-20-zip_First15Tasks.zip
      - name: Inspect S20 no-patch control on same tasks
        run: |
          python Co_Kaggle/g6/tests_on_tasks/tools/inspect_submission21_archive.py \
            Co_Kaggle/g6/tests_on_tasks/diagnostics/submission-20-zip_First15Tasks.zip \
            --task-evidence \
            --compare Co_Kaggle/g6/tests_on_tasks/diagnostics/submission-21-zip_First15Tasks.zip
      - name: Verify all fifteen task diagnoses appear in reviewed Markdown
        run: |
          python - <<'PY'
          import json, pathlib, re, zipfile
          root=pathlib.Path('Co_Kaggle/g6/tests_on_tasks/diagnostics')
          review=(root/'submission_21_validation_rootcause_review.md').read_text()
          with zipfile.ZipFile(root/'submission-21-zip_First15Tasks.zip') as z:
              selected=json.loads(z.read(next(n for n in z.namelist() if n.endswith('/selected_tasks.json'))))
          ids={row['instance_id'] for row in selected}
          covered=set(re.findall(r'^\| `((?:fastapi|requests)_\d+)` \|',review,re.M))
          assert len(ids)==15 and covered==ids,(sorted(ids-covered),sorted(covered-ids))
          print('S21 report covers all 15 exact evaluation task IDs')
          PY
