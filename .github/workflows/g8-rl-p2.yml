name: g8 RL P2 checks
on:
  pull_request:
    paths:
      - "Co_Kaggle/g8/rl/**"
      - "Co_Kaggle/g8/submissions/submission-nb - Version 23.ipynb"
      - ".github/workflows/g8-rl-p2.yml"
  push:
    paths:
      - "Co_Kaggle/g8/rl/p2/**"
      - "Co_Kaggle/g8/rl/common/**"
      - ".github/workflows/g8-rl-p2.yml"
jobs:
  p2-unit-and-physics:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned simulator dependencies
        run: python -m pip install -r Co_Kaggle/g8/rl/p0/requirements-simulator.txt
      - name: Install CPU PyTorch
        run: python -m pip install -r Co_Kaggle/g8/rl/common/requirements.txt --index-url https://download.pytorch.org/whl/cpu
      - name: P2 unit tests
        run: python -m unittest Co_Kaggle.g8.rl.p2.test_p2 -v
      - name: P2 official simulator integration
        run: python -m Co_Kaggle.g8.rl.p2.physics_smoke
