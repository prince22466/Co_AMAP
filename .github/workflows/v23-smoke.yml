name: v23 smoke

on:
  pull_request:
    paths:
      - "Co_Kaggle/g5/local_arena/v23/**"
      - ".github/workflows/v23-smoke.yml"
  push:
    branches: [main]
    paths:
      - "Co_Kaggle/g5/local_arena/v23/**"
      - ".github/workflows/v23-smoke.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Co_Kaggle/g5/local_arena/v23
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: Co_Kaggle/g5/local_arena/v23/requirements.txt
      - name: Resolve full v23 requirements
        run: python -m pip install --dry-run -r requirements.txt
      - name: Install smoke-test runtime
        run: |
          python -m pip install "openai>=2.45.0,<3" "openai-agents==0.19.0" "numpy>=1.26"
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile v23 Python
        run: python -m py_compile research_agent.py agent/*.py replay/*.py tests/*.py
      - name: Runtime smoke test
        run: python tests/smoke_runtime.py
      - name: FP16 smoke test
        run: python tests/smoke_fp16.py
