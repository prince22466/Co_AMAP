name: g6 submission 24 CPU and official ADK runtime
on:
  pull_request:
    paths:
      - 'Co_Kaggle/g6/submission_nb/submission_24/**'
      - 'Co_Kaggle/g6/submission_nb/artifacts/submission_24*'
      - 'Co_Kaggle/g6/tests_on_tasks/tools/*submission24*.py'
      - '.github/workflows/g6-submission24.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LITELLM_LOCAL_MODEL_COST_MAP: 'True'
      OTEL_SDK_DISABLED: 'true'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: Co_Kaggle/g6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install hash-checked official compiler and CPU dependencies
        run: python Co_Kaggle/g6/tests_on_tasks/tools/install_submission24_runtime.py --wheel-dir /tmp/g6-wheels
      - name: Package, comparison, graph, context and recovery regressions
        run: python -m unittest discover -s Co_Kaggle/g6/tests_on_tasks/tools -p 'test_submission24*.py' -v
      - name: Execute packaged official-runtime smoke and verify release bytes
        run: |
          python Co_Kaggle/g6/tests_on_tasks/tools/smoke_submission24.py --output /tmp/s24-smoke
          git diff --exit-code -- Co_Kaggle/g6/submission_nb/artifacts/submission_24.zip Co_Kaggle/g6/submission_nb/artifacts/submission_24.manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: submission-24-e4b-unscored
          path: |
            Co_Kaggle/g6/submission_nb/artifacts/submission_24.zip
            Co_Kaggle/g6/submission_nb/artifacts/submission_24.manifest.json
            /tmp/s24-smoke/smoke.json
