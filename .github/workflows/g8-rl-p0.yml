name: g8 RL P0 contract tests

on:
  push:
    paths:
      - "Co_Kaggle/g8/rl/**"
      - ".github/workflows/g8-rl-p0.yml"
  pull_request:
    paths:
      - "Co_Kaggle/g8/rl/**"
      - ".github/workflows/g8-rl-p0.yml"

jobs:
  p0-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy
      - name: Compile research Python sources
        run: python -m compileall -q Co_Kaggle/g8/rl
      - name: Contract and scoring tests
        run: python -m unittest discover -s Co_Kaggle/g8/rl/p0/tests -v
      - name: Inventory uploaded training scenarios
        run: python -m Co_Kaggle.g8.rl.p0.benchmark --list
