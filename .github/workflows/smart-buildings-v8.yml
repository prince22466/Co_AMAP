name: Smart Buildings V8 event-controller checks

on:
  pull_request:
    paths:
      - 'Co_Kaggle/g8/submissions/submission-nb - Version 8.ipynb'
      - 'Co_Kaggle/g8/submissions/test_version8.py'
      - '.github/workflows/smart-buildings-v8.yml'
  workflow_dispatch:

jobs:
  validate-v8:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test runtime
        run: python -m pip install 'numpy>=1.24,<3'
      - name: Run notebook contract and behavior tests
        run: python Co_Kaggle/g8/submissions/test_version8.py
