name: g8 Version 23 MIMO / hierarchical control

on:
  pull_request:
    paths:
      - "Co_Kaggle/g8/submissions/submission-nb - Version 23.ipynb"
      - "Co_Kaggle/g8/submissions/test_version23.py"
      - ".github/workflows/g8-version23.yml"
  push:
    branches:
      - "g8/version23-mimo-hierarchical-shared-hvac"
    paths:
      - "Co_Kaggle/g8/submissions/submission-nb - Version 23.ipynb"
      - "Co_Kaggle/g8/submissions/test_version23.py"
      - ".github/workflows/g8-version23.yml"

jobs:
  synthetic-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime dependency
        run: python -m pip install numpy
      - name: Validate notebook and controller
        run: python Co_Kaggle/g8/submissions/test_version23.py
