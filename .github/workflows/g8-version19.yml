name: g8 Version 19 ILC smoke tests
on:
  pull_request:
    paths:
      - 'Co_Kaggle/g8/submissions/submission-nb - Version 19.ipynb'
      - 'Co_Kaggle/g8/submissions/test_version19.py'
      - '.github/workflows/g8-version19.yml'
  push:
    paths:
      - 'Co_Kaggle/g8/submissions/submission-nb - Version 19.ipynb'
      - 'Co_Kaggle/g8/submissions/test_version19.py'
      - '.github/workflows/g8-version19.yml'
jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy
      - run: python Co_Kaggle/g8/submissions/test_version19.py
