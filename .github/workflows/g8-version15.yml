name: G8 Version 15 auto-tuning and policy checks

on:
  push:
    branches: [feat/g8-version15-auto-tuning]
    paths:
      - 'Co_Kaggle/g8/submissions/submission-nb - Version 15.ipynb'
      - 'Co_Kaggle/g8/submissions/tune_version15.py'
      - 'Co_Kaggle/g8/submissions/test_version15.py'
      - '.github/workflows/g8-version15.yml'
  pull_request:
    paths:
      - 'Co_Kaggle/g8/submissions/submission-nb - Version 15.ipynb'
      - 'Co_Kaggle/g8/submissions/tune_version15.py'
      - 'Co_Kaggle/g8/submissions/test_version15.py'
      - '.github/workflows/g8-version15.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy-and-search-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          # This repository includes very large unrelated Kaggle artifacts.
          # Fetch only g8 source blobs so CI is fast and avoids a full clone.
          filter: blob:none
          sparse-checkout: |
            Co_Kaggle/g8/submissions
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.24,<3' cma scikit-optimize
      - name: Compile tuner and test the real notebook cell
        run: |
          python -m py_compile 'Co_Kaggle/g8/submissions/tune_version15.py' 'Co_Kaggle/g8/submissions/test_version15.py'
          python 'Co_Kaggle/g8/submissions/test_version15.py'
