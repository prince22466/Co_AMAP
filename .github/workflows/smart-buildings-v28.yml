name: Smart Buildings V28 P3 deployment tests
on:
  pull_request:
    paths:
      - "Co_Kaggle/g8/submissions/submission-nb - Version 28.ipynb"
      - "Co_Kaggle/g8/submissions/test_version28.py"
      - "Co_Kaggle/g8/submissions/submission-nb - Version 23.ipynb"
      - "Co_Kaggle/g8/rl/p3/**"
      - "Co_Kaggle/g8/rl/common/**"
      - ".github/workflows/smart-buildings-v28.yml"
  workflow_dispatch:
jobs:
  deployment-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy
      - run: python -m pip install -r Co_Kaggle/g8/rl/common/requirements.txt --index-url https://download.pytorch.org/whl/cpu
      - run: python Co_Kaggle/g8/submissions/test_version28.py
