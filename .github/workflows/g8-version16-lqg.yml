name: G8 Version 16 LQR LQG smoke test

on:
  pull_request:
    paths:
      - 'Co_Kaggle/g8/submissions/submission-nb - Version 16.ipynb'
      - 'Co_Kaggle/g8/submissions/test_version16.py'
      - '.github/workflows/g8-version16-lqg.yml'
  workflow_dispatch:

jobs:
  synthetic-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal inference dependency
        run: python -m pip install numpy
      - name: Run exact-notebook tests
        run: python Co_Kaggle/g8/submissions/test_version16.py
