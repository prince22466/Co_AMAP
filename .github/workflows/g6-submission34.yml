name: G6 Submission 34 CPU Contract

on:
  pull_request:
    paths:
      - 'Co_Kaggle/g6/submission_nb/submission_34/**'
      - 'Co_Kaggle/g6/submission_nb/artifacts/submission_34.zip'
      - 'Co_Kaggle/g6/tests_on_tasks/tools/*submission34*.py'
      - '.github/workflows/g6-submission34.yml'
  workflow_dispatch:

jobs:
  submission34-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML validator
        run: python -m pip install pyyaml
      - name: Compile S34 tools and tests
        run: |
          python -m py_compile Co_Kaggle/g6/tests_on_tasks/tools/build_submission34.py
          python -m py_compile Co_Kaggle/g6/tests_on_tasks/tools/test_submission34.py
          python -m py_compile Co_Kaggle/g6/tests_on_tasks/tools/analyze_submission34.py
          python -m py_compile Co_Kaggle/g6/tests_on_tasks/tools/test_analyze_submission34.py
      - name: Run S34 package and synthetic telemetry tests
        working-directory: Co_Kaggle/g6/tests_on_tasks/tools
        run: python -m unittest -v test_submission34.py test_analyze_submission34.py
      - name: Rebuild package from committed sources
        working-directory: Co_Kaggle/g6/tests_on_tasks/tools
        run: python build_submission34.py
      - name: Assert ZIP is identical to committed artifact
        run: git diff --exit-code -- Co_Kaggle/g6/submission_nb/artifacts/submission_34.zip
      - name: Upload unscored S34 ZIP
        uses: actions/upload-artifact@v4
        with:
          name: submission34-cpu-artifacts
          if-no-files-found: error
          path: |
            Co_Kaggle/g6/submission_nb/artifacts/submission_34.zip
            Co_Kaggle/g6/submission_nb/artifacts/submission_34.manifest.json
