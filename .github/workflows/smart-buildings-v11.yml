name: Smart Buildings V11 contract tests

on:
  pull_request:
    paths:
      - 'Co_Kaggle/g8/submissions/submission-nb - Version 11.ipynb'
      - 'Co_Kaggle/g8/submissions/test_version11.py'
      - '.github/workflows/smart-buildings-v11.yml'
  push:
    branches:
      - main
    paths:
      - 'Co_Kaggle/g8/submissions/submission-nb - Version 11.ipynb'
      - 'Co_Kaggle/g8/submissions/test_version11.py'
      - '.github/workflows/smart-buildings-v11.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy
      - run: python 'Co_Kaggle/g8/submissions/test_version11.py'
