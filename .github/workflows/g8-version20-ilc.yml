name: g8 Version 20 ILC Kaggle notebook checks
on:
  pull_request:
    paths:
      - 'Co_Kaggle/g8/submissions/submission-nb - Version 20.ipynb'
      - 'Co_Kaggle/g8/submissions/test_version20_ilc.py'
      - '.github/workflows/g8-version20-ilc.yml'
  push:
    paths:
      - 'Co_Kaggle/g8/submissions/submission-nb - Version 20.ipynb'
      - 'Co_Kaggle/g8/submissions/test_version20_ilc.py'
      - '.github/workflows/g8-version20-ilc.yml'
jobs:
  notebook-smoke-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy
      - run: python Co_Kaggle/g8/submissions/test_version20_ilc.py
