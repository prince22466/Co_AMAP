name: Smart Buildings V7 policy smoke tests

on:
  pull_request:
    paths:
      - 'Co_Kaggle/g8/submissions/submission-nb - Version 7.ipynb'
      - 'Co_Kaggle/g8/submissions/test_version7.py'
      - '.github/workflows/smart-buildings-v7.yml'
  workflow_dispatch:

jobs:
  validate-v7:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install notebook runtime dependency
        run: python -m pip install 'numpy>=1.24,<3'
      - name: Validate notebook interface, physics and bounded runtime
        run: python Co_Kaggle/g8/submissions/test_version7.py
