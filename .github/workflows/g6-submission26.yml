name: G6 submission 26 package
on:
  pull_request:
    paths:
      - 'Co_Kaggle/g6/submission_nb/submission_26/**'
      - 'Co_Kaggle/g6/tests_on_tasks/tools/*submission26*.py'
      - '.github/workflows/g6-submission26.yml'
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3
      - name: Build S26 artifact
        run: python Co_Kaggle/g6/tests_on_tasks/tools/build_submission26.py
      - name: Static regression checks
        run: python -m unittest discover -s Co_Kaggle/g6/tests_on_tasks/tools -p test_submission26.py -v
      - uses: actions/upload-artifact@v4
        with:
          name: submission_26
          path: |
            Co_Kaggle/g6/submission_nb/artifacts/submission_26.zip
            Co_Kaggle/g6/submission_nb/artifacts/submission_26.manifest.json
