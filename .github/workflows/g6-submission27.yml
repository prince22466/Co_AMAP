name: G6 Submission 27 CPU Contract
on:
  pull_request:
    paths:
      - 'Co_Kaggle/g6/submission_nb/submission_27/**'
      - 'Co_Kaggle/g6/tests_on_tasks/tools/*submission27*.py'
      - '.github/workflows/g6-submission27.yml'
  workflow_dispatch:
jobs:
  s27-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyyaml
      - run: python -m unittest discover -s Co_Kaggle/g6/tests_on_tasks/tools -p test_submission27.py -v
      - run: python -m py_compile Co_Kaggle/g6/tests_on_tasks/tools/*submission27*.py
