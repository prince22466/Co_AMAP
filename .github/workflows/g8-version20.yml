name: G8 Version 20 sliding-mode contract checks

on:
  pull_request:
    paths:
      - 'Co_Kaggle/g8/submissions/submission-nb - Version 20.ipynb'
      - 'Co_Kaggle/g8/tests/test_version20.py'
      - '.github/workflows/g8-version20.yml'
  push:
    branches:
      - feat/g8-version20-sliding-mode
    paths:
      - 'Co_Kaggle/g8/submissions/submission-nb - Version 20.ipynb'
      - 'Co_Kaggle/g8/tests/test_version20.py'
      - '.github/workflows/g8-version20.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notebook-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            Co_Kaggle/g8
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.24,<3'
      - name: Compile and execute mock-gateway policy tests
        run: |
          python -m py_compile Co_Kaggle/g8/tests/test_version20.py
          python -m unittest discover -s Co_Kaggle/g8/tests -p 'test_version20.py' -v
