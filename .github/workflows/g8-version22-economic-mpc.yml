name: g8 Version 22 Economic MPC

on:
  pull_request:
    paths:
      - "Co_Kaggle/g8/submissions/submission-nb - Version 22.ipynb"
      - "Co_Kaggle/g8/submissions/test_version22.py"
      - ".github/workflows/g8-version22-economic-mpc.yml"
  push:
    paths:
      - "Co_Kaggle/g8/submissions/submission-nb - Version 22.ipynb"
      - "Co_Kaggle/g8/submissions/test_version22.py"
      - ".github/workflows/g8-version22-economic-mpc.yml"
  workflow_dispatch:

jobs:
  contract-and-objective:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install numpy
        run: python -m pip install "numpy>=1.24,<3"
      - name: Run economic MPC regression tests
        run: python "Co_Kaggle/g8/submissions/test_version22.py"
