name: G6 quick public task set integrity
on:
  push:
    branches: [g6/validated-quick-task-sets]
    paths:
      - 'Co_Kaggle/g6/tests_on_tasks/quick_sets/**'
      - 'Co_Kaggle/g6/tests_on_tasks/tools/materialize_quick_task_set.py'
      - 'Co_Kaggle/g6/tests_on_tasks/tools/test_public_quick_task_sets.py'
      - '.github/workflows/g6-quick-task-sets.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  task-set-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            Co_Kaggle/g6/competition_material/competition_data/tasks.jsonl
            Co_Kaggle/g6/tests_on_tasks/quick_sets
            Co_Kaggle/g6/tests_on_tasks/tools/materialize_quick_task_set.py
            Co_Kaggle/g6/tests_on_tasks/tools/test_public_quick_task_sets.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate all IDs, red-to-green evidence, original task serialization
        run: |
          python Co_Kaggle/g6/tests_on_tasks/tools/test_public_quick_task_sets.py
