name: G8 Version 12 synthetic policy checks

on:
  push:
    branches: [g8-version12-efficient-mpc]
    paths:
      - 'Co_Kaggle/g8/submissions/submission-nb - Version 12.ipynb'
      - 'Co_Kaggle/g8/submissions/test_version12.py'
      - '.github/workflows/g8-version12.yml'
  pull_request:
    paths:
      - 'Co_Kaggle/g8/submissions/submission-nb - Version 12.ipynb'
      - 'Co_Kaggle/g8/submissions/test_version12.py'
      - '.github/workflows/g8-version12.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.24,<3'
      - name: Validate the submitted notebook policy and search
        run: python 'Co_Kaggle/g8/submissions/test_version12.py'
