name: g8 Version 26 robust stochastic MPC

on:
  pull_request:
    paths:
      - "Co_Kaggle/g8/submissions/submission-nb - Version 26.ipynb"
      - "Co_Kaggle/g8/submissions/test_version26.py"
      - ".github/workflows/g8-version26-robust-mpc.yml"
  push:
    paths:
      - "Co_Kaggle/g8/submissions/submission-nb - Version 26.ipynb"
      - "Co_Kaggle/g8/submissions/test_version26.py"
      - ".github/workflows/g8-version26-robust-mpc.yml"
  workflow_dispatch:

jobs:
  notebook-and-controller-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install NumPy only
        run: python -m pip install "numpy>=1.24,<3"
      - name: Check Kaggle interface, uncertainty scenarios, fallback and runtime
        run: python "Co_Kaggle/g8/submissions/test_version26.py"
