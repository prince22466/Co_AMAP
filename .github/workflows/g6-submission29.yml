name: G6 Submission 29 CPU Contract
on:
  pull_request:
    paths:
      - 'Co_Kaggle/g6/submission_nb/submission_29/**'
      - 'Co_Kaggle/g6/submission_nb/artifacts/submission_29.zip'
      - 'Co_Kaggle/g6/tests_on_tasks/tools/*submission29*.py'
      - '.github/workflows/g6-submission29.yml'
  workflow_dispatch:
jobs:
  s29-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python contract dependencies
        run: python -m pip install pyyaml
      - name: Syntax-check evaluator, gate and builder
        run: python -m py_compile Co_Kaggle/g6/tests_on_tasks/tools/*submission29*.py
      - name: Unit tests including S28 negative regression
        run: python -m unittest discover -s Co_Kaggle/g6/tests_on_tasks/tools -p test_submission29.py -v
      - name: Reproducible checked-in artifact
        run: git diff --exit-code -- Co_Kaggle/g6/submission_nb/artifacts/submission_29.zip
      - uses: actions/upload-artifact@v4
        with:
          name: submission_29
          path: |
            Co_Kaggle/g6/submission_nb/artifacts/submission_29.zip
            Co_Kaggle/g6/submission_nb/artifacts/submission_29.manifest.json
          if-no-files-found: error
