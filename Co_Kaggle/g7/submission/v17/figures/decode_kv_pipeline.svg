<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 567" width="1000" height="567" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, Arial, sans-serif" fill="#19374e" role="img"><title>Decode KV Cache 单 Tile 前瞻读取</title><desc>示例两轮迭代。优化前每轮读取自己的 K/V；本方案先加载 KV0，QK0 后加载 KV1，再 Softmax/PV0，QK1 后对越界 KV2 执行带掩码的前瞻，最后 Softmax/PV1。虚线表示数据依赖，非硬件计时。</desc><rect width="1000" height="567" fill="#fff"/><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#526a7d"/></marker></defs>
<text x="500" y="30" font-size="25" text-anchor="middle" font-weight="700" fill="#19374e">Decode KV Cache 单 Tile 前瞻读取</text>
<text x="500" y="58" font-size="18" text-anchor="middle" font-weight="400" fill="#526a7d">按源码顺序展示；箭头表示执行顺序或数据依赖，不表示实测硬件时间。</text>
<rect x="20" y="77" width="960" height="148" rx="9" fill="#f8fafc" stroke="#b4c6d6"/>
<text x="40" y="107" font-size="22" text-anchor="start" font-weight="700" fill="#19374e">优化前：每轮先读取当前 KV，再执行当前计算</text>
<rect x="40" y="126" width="110" height="43" rx="5" fill="#b9d4ef" stroke="#7198bd"/><text x="95" y="153.62" font-size="18" text-anchor="middle" font-weight="600" fill="#19374e">Load KV0</text>
<path d="M152 147 L173 147" fill="none" stroke="#526a7d" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="178" y="126" width="83" height="43" rx="5" fill="#d9eddf" stroke="#78a98a"/><text x="219.5" y="153.62" font-size="18" text-anchor="middle" font-weight="600" fill="#19374e">QK0</text>
<path d="M263 147 L284 147" fill="none" stroke="#526a7d" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="289" y="126" width="169" height="43" rx="5" fill="#d9eddf" stroke="#78a98a"/><text x="373.5" y="153.62" font-size="18" text-anchor="middle" font-weight="600" fill="#19374e">Softmax / PV0</text>
<text x="249" y="198" font-size="18" text-anchor="middle" font-weight="400" fill="#526a7d">迭代 0</text>
<rect x="510" y="126" width="110" height="43" rx="5" fill="#b9d4ef" stroke="#7198bd"/><text x="565" y="153.62" font-size="18" text-anchor="middle" font-weight="600" fill="#19374e">Load KV1</text>
<path d="M622 147 L643 147" fill="none" stroke="#526a7d" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="648" y="126" width="83" height="43" rx="5" fill="#d9eddf" stroke="#78a98a"/><text x="689.5" y="153.62" font-size="18" text-anchor="middle" font-weight="600" fill="#19374e">QK1</text>
<path d="M733 147 L754 147" fill="none" stroke="#526a7d" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="759" y="126" width="169" height="43" rx="5" fill="#d9eddf" stroke="#78a98a"/><text x="843.5" y="153.62" font-size="18" text-anchor="middle" font-weight="600" fill="#19374e">Softmax / PV1</text>
<text x="719" y="198" font-size="18" text-anchor="middle" font-weight="400" fill="#526a7d">迭代 1</text>
<path d="M460 147 L505 147" fill="none" stroke="#526a7d" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="20" y="241" width="960" height="277" rx="9" fill="#f8fafc" stroke="#b4c6d6"/>
<text x="40" y="273" font-size="22" text-anchor="start" font-weight="700" fill="#19374e">本方案：提前读取下一 Tile，并携带到下一轮</text>
<rect x="40" y="298" width="128" height="46" rx="5" fill="#b9d4ef" stroke="#7198bd"/><text x="104" y="327.12" font-size="18" text-anchor="middle" font-weight="600" fill="#19374e">Load KV0</text>
<path d="M170 321 L191 321" fill="none" stroke="#526a7d" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="196" y="298" width="80" height="46" rx="5" fill="#d9eddf" stroke="#78a98a"/><text x="236" y="327.12" font-size="18" text-anchor="middle" font-weight="600" fill="#19374e">QK0</text>
<path d="M278 321 L299 321" fill="none" stroke="#526a7d" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="304" y="298" width="126" height="46" rx="5" fill="#b9d4ef" stroke="#7198bd"/><text x="367" y="327.12" font-size="18" text-anchor="middle" font-weight="600" fill="#19374e">Load KV1</text>
<path d="M432 321 L453 321" fill="none" stroke="#526a7d" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="458" y="298" width="166" height="46" rx="5" fill="#d9eddf" stroke="#78a98a"/><text x="541" y="327.12" font-size="18" text-anchor="middle" font-weight="600" fill="#19374e">Softmax / PV0</text>
<path d="M626 321 L647 321" fill="none" stroke="#526a7d" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="652" y="298" width="80" height="46" rx="5" fill="#d9eddf" stroke="#78a98a"/><text x="692" y="327.12" font-size="18" text-anchor="middle" font-weight="600" fill="#19374e">QK1</text>
<path d="M734 321 L755 321" fill="none" stroke="#526a7d" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="760" y="298" width="195" height="46" rx="5" fill="#fce8c7" stroke="#b98138"/><text x="857.5" y="327.12" font-size="18" text-anchor="middle" font-weight="600" fill="#19374e">Load KV2（掩码）</text>
<path d="M367 298 V286 H692 V298" stroke="#526a7d" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<text x="529" y="377" font-size="18" text-anchor="middle" font-weight="600" fill="#19374e">KV1 作为循环携带值，供下一轮 QK / PV 使用</text>
<path d="M104 346 V393 H540 V346" stroke="#526a7d" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<text x="321" y="418" font-size="18" text-anchor="middle" font-weight="600" fill="#19374e">当前 PV0 仍使用 V0</text>
<path d="M857 346 V433 H750" stroke="#526a7d" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="526" y="430" width="220" height="45" rx="5" fill="#d9eddf" stroke="#78a98a"/><text x="636" y="458.62" font-size="18" text-anchor="middle" font-weight="600" fill="#19374e">Softmax / PV1</text>
<text x="41" y="493" font-size="18" text-anchor="start" font-weight="400" fill="#526a7d">蓝色：K/V 读取；绿色：计算；橙色：最后一轮的越界前瞻（掩码屏蔽）</text>
<text x="500" y="549" font-size="19" text-anchor="middle" font-weight="600" fill="#19374e">下一 Tile 的读取提前到当前 Softmax / PV 之前；能否实际重叠由编译器与硬件决定。</text>
</svg>
