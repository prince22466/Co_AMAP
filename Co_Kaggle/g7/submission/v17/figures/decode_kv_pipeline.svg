<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 587" width="1000" height="587" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, Arial, sans-serif" fill="#19374e" role="img"><title>Decode KV Cache 单 Tile 前瞻读取</title><desc>示例两轮迭代。优化前各轮先读取当前 K/V；本方案循环前加载 KV0，QK0 后加载 KV1，执行当前 Softmax/PV0，再用携带的 KV1 执行 QK1，最后一轮的越界前瞻全部屏蔽，然后执行 Softmax/PV1。箭头仅表示源码顺序。</desc><rect width="1000" height="587" fill="#fff"/><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#526a7d"/></marker></defs>
<text x="500" y="30" font-size="25" text-anchor="middle" font-weight="700" fill="#19374e">Decode KV Cache 单 Tile 前瞻读取</text>
<text x="500" y="59" font-size="19" text-anchor="middle" font-weight="400" fill="#526a7d">两轮迭代示例：箭头表示源码顺序，不是 GPU 实测时间线。</text>
<rect x="20" y="76" width="960" height="149" rx="8" fill="#f8fafc" stroke="#b4c6d6"/>
<text x="40" y="105" font-size="22" text-anchor="start" font-weight="700" fill="#19374e">优化前：每轮读取当前 KV</text>
<text x="48" y="142" font-size="18" text-anchor="start" font-weight="600" fill="#19374e">迭代 0</text>
<rect x="185" y="116" width="185" height="37" rx="5" fill="#b9d4ef" stroke="#7198bd"/><text x="277.5" y="140.62" font-size="18" text-anchor="middle" font-weight="600" fill="#19374e">Load KV0</text>
<path d="M375 134 L408 134" fill="none" stroke="#526a7d" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="414" y="116" width="150" height="37" rx="5" fill="#d9eddf" stroke="#78a98a"/><text x="489" y="140.62" font-size="18" text-anchor="middle" font-weight="600" fill="#19374e">QK0</text>
<path d="M569 134 L602 134" fill="none" stroke="#526a7d" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="608" y="116" width="330" height="37" rx="5" fill="#d9eddf" stroke="#78a98a"/><text x="773" y="140.62" font-size="18" text-anchor="middle" font-weight="600" fill="#19374e">Online Softmax / PV0</text>
<text x="48" y="190" font-size="18" text-anchor="start" font-weight="600" fill="#19374e">迭代 1</text>
<rect x="185" y="164" width="185" height="37" rx="5" fill="#b9d4ef" stroke="#7198bd"/><text x="277.5" y="188.62" font-size="18" text-anchor="middle" font-weight="600" fill="#19374e">Load KV1</text>
<path d="M375 182 L408 182" fill="none" stroke="#526a7d" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="414" y="164" width="150" height="37" rx="5" fill="#d9eddf" stroke="#78a98a"/><text x="489" y="188.62" font-size="18" text-anchor="middle" font-weight="600" fill="#19374e">QK1</text>
<path d="M569 182 L602 182" fill="none" stroke="#526a7d" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="608" y="164" width="330" height="37" rx="5" fill="#d9eddf" stroke="#78a98a"/><text x="773" y="188.62" font-size="18" text-anchor="middle" font-weight="600" fill="#19374e">Online Softmax / PV1</text>
<rect x="20" y="241" width="960" height="269" rx="8" fill="#f8fafc" stroke="#b4c6d6"/>
<text x="40" y="271" font-size="22" text-anchor="start" font-weight="700" fill="#19374e">本方案：循环前预加载，QK 之后读取下一 KV</text>
<text x="48" y="311" font-size="18" text-anchor="start" font-weight="600" fill="#19374e">循环前</text>
<rect x="185" y="286" width="185" height="37" rx="5" fill="#b9d4ef" stroke="#7198bd"/><text x="277.5" y="310.62" font-size="18" text-anchor="middle" font-weight="600" fill="#19374e">Load KV0</text>
<path d="M375 304 L408 304" fill="none" stroke="#526a7d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="416" y="310" font-size="18" text-anchor="start" font-weight="400" fill="#526a7d">初始化 prefetched_k / prefetched_v</text>
<text x="48" y="364" font-size="18" text-anchor="start" font-weight="600" fill="#19374e">迭代 0</text>
<rect x="185" y="337" width="150" height="42" rx="5" fill="#d9eddf" stroke="#78a98a"/><text x="260" y="364.12" font-size="18" text-anchor="middle" font-weight="600" fill="#19374e">QK0</text>
<path d="M340 358 L373 358" fill="none" stroke="#526a7d" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="379" y="337" width="232" height="42" rx="5" fill="#b9d4ef" stroke="#7198bd"/><text x="495" y="364.12" font-size="18" text-anchor="middle" font-weight="600" fill="#19374e">Load KV1</text>
<path d="M616 358 L649 358" fill="none" stroke="#526a7d" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="655" y="337" width="283" height="42" rx="5" fill="#d9eddf" stroke="#78a98a"/><text x="796.5" y="364.12" font-size="18" text-anchor="middle" font-weight="600" fill="#19374e">Online Softmax / PV0</text>
<text x="185" y="402" font-size="18" text-anchor="start" font-weight="400" fill="#526a7d">KV1 携带至下一轮；当前 PV0 仍使用 V0。</text>
<text x="48" y="442" font-size="18" text-anchor="start" font-weight="600" fill="#19374e">迭代 1</text>
<rect x="185" y="415" width="150" height="42" rx="5" fill="#d9eddf" stroke="#78a98a"/><text x="260" y="442.12" font-size="18" text-anchor="middle" font-weight="600" fill="#19374e">QK1</text>
<path d="M340 436 L373 436" fill="none" stroke="#526a7d" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="379" y="415" width="232" height="42" rx="5" fill="#fce8c7" stroke="#b98138"/><text x="495" y="442.12" font-size="18" text-anchor="middle" font-weight="600" fill="#19374e">Load KV2（全部屏蔽）</text>
<path d="M616 436 L649 436" fill="none" stroke="#526a7d" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="655" y="415" width="283" height="42" rx="5" fill="#d9eddf" stroke="#78a98a"/><text x="796.5" y="442.12" font-size="18" text-anchor="middle" font-weight="600" fill="#19374e">Online Softmax / PV1</text>
<text x="185" y="480" font-size="18" text-anchor="start" font-weight="400" fill="#526a7d">最后一轮前瞻被掩码屏蔽；当前 PV1 仍使用 V1。</text>
<text x="500" y="539" font-size="18" text-anchor="middle" font-weight="400" fill="#526a7d">蓝色：读取　绿色：计算　橙色：掩码屏蔽的越界前瞻</text>
<text x="500" y="570" font-size="19" text-anchor="middle" font-weight="600" fill="#19374e">下一 Tile 的读取提前到当前 Softmax / PV 之前；实际硬件重叠尚需验证。</text>
</svg>
